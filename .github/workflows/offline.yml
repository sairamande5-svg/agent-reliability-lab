name: Offline verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned property-test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Tests, offline experiments, and versioned regression gate
        run: python -m agentlab.verify --properties --output artifacts/portfolio
      - uses: actions/upload-artifact@v4
        with:
          name: offline-demo-python-${{ matrix.python }}
          path: |
            artifacts/portfolio/index.html
            artifacts/portfolio/report.json
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional browser test tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance
        run: python -m tools.browser_smoke --screenshot artifacts/browser/dashboard.png
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-evidence
          path: artifacts/browser/dashboard.png
          if-no-files-found: error
